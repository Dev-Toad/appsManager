{% extends "base.html" %}

{% block title %}Mis Aplicaciones{% endblock %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-4">
    {% for app in apps %}
        <div class="max-w-sm rounded overflow-hidden shadow-lg bg-white">
            
            <div class="w-full h-48 flex justify-center items-center p-6 bg-gray-50"> 
                <img 
                    class="h-full w-auto object-contain" 
                    src="https://reporte-login.atentus.com/assets/logo-atentus-28dacca2.svg" 
                    alt="Imagen del producto o servicio">
            </div>
            
            <div class="px-6 py-4">
                <div class="font-bold text-xl mb-2 text-gray-900">
                    {{ app.nombre }}
                </div>
                <p class="text-gray-600 mb-4">{{ app.descripcion[:100] }}{% if app.descripcion|length > 100 %}...{% endif %}</p>
            </div>
            
            <div class="px-6 pt-4 pb-4">
                <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">{{ app.tipo }}</span>
                <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">{{ app.stack }}</span>
            </div>
            
            
            <div class="px-6 pb-6">
                <a href="{{ url_for('app.view_app', app_id=app.id) }}" 
                
                class="inline-block text-center w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition duration-150 ease-in-out">
                    Ver Proyecto
                </a>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
