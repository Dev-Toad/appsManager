services:
  web:
    
    build: .
    container_name: flask_app
    env_file:
      - .env
    environment:
      FLASK_APP: run:app
      FLASK_ENV: development
      DATABASE_URL: postgresql://andres:1q2w3e4r5t@db:5432/demo
      
    ports:
      - "8000:8000"   
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16
    container_name: demo_db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: andres
      POSTGRES_PASSWORD: 1q2w3e4r5t
    ports:
      - "5433:5432"
    volumes:
      - demo_pgdata:/var/lib/postgresql/data

volumes:
  demo_pgdata:
