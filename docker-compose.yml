services:
  web:
    build: .
    container_name: flask_app
    env_file:
      - .env
    environment:
      FLASK_APP: run:app
      FLASK_ENV: production
    depends_on:
      - db
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./uploads:/app/uploads
      # Persistimos migraciones en producción (para que no se pierdan al recrear contenedor)
      - migrations_data:/app/migrations
    command: >
      bash -lc '
      set -e;

      # Asegurar carpeta persistente
      mkdir -p /app/migrations;

      # Init SOLO si no existe la estructura de Alembic
      if [ ! -d /app/migrations/versions ] || [ ! -f /app/migrations/env.py ]; then
        flask db init;
      fi;

      # Generar migración si hay cambios (si no hay, no falla)
      flask db migrate -m "auto migrate" || true;

      # Aplicar migraciones
      flask db upgrade;

      # Levantar app
      exec gunicorn -b 0.0.0.0:8000 run:app
      '

  db:
    image: postgres:16
    container_name: demo_db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: andres
      POSTGRES_PASSWORD: 1q2w3e4r5t
    restart: unless-stopped
    volumes:
      - demo_pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: demo_nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - prod

volumes:
  demo_pgdata:
  migrations_data:
