services:
  web:
    build: .
    container_name: flask_app
    env_file:
      - .env
    environment:
      FLASK_APP: run:app
      FLASK_ENV: production
    depends_on:
      - db
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./uploads:/app/uploads
      - migrations_data:/app/migrations
    command: >
      bash -lc "
      set -e;

      # 1) Asegura carpeta de migraciones persistente
      mkdir -p /app/migrations;

      # 2) Init solo si no existe estructura (versions/)
      if [ ! -d /app/migrations/versions ]; then
        flask db init;
      fi;

      # 3) Genera migración si hay cambios (si no hay, no tumba el contenedor)
      flask db migrate -m 'auto migrate' || true;

      # 4) Aplica migraciones
      flask db upgrade;

      # 5) Levanta la app
      gunicorn -b 0.0.0.0:8000 run:app
      "

  db:
    image: postgres:16
    container_name: demo_db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: andres
      POSTGRES_PASSWORD: 1q2w3e4r5t
    restart: unless-stopped
    volumes:
      - demo_pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: demo_nginx
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  demo_pgdata:
  migrations_data:
